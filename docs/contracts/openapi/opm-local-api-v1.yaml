          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            normalized_endpoints: {type: array, minItems: 2, items: {$ref: "#/components/schemas/NormalizedEndpoint"}}
            direction: {type: string, enum: [DIRECTED, BIDIRECTIONAL, UNDIRECTED]}
            labels: {type: array, items: {$ref: "#/components/schemas/LabelInput"}}
            modifiers: {type: array, items: {$ref: "#/components/schemas/ModifierInput"}}
            condition: {$ref: "#/components/schemas/ConditionInput"}
            logical_groups: {type: array, items: {$ref: "#/components/schemas/LogicalGroupInput"}}
            collection_completeness: {type: string, enum: [COMPLETE, INCOMPLETE, NOT_APPLICABLE]}
        capability_query_id: {$ref: "#/components/schemas/StableId"}
        selected_option_id: {$ref: "#/components/schemas/StableId"}
    DeleteConstructPayload:
      type: object
      additionalProperties: false
      required: [construct_kind, construct_id, impact_token]
      properties:
        construct_kind: {type: string, enum: [ELEMENT, STATE, FACT, FEATURE, CONTEXT]}
        construct_id: {$ref: "#/components/schemas/StableId"}
        impact_token: {type: string, minLength: 16, maxLength: 2048}
    StatePresentationPayload:
      type: object
      additionalProperties: false
      required: [context_id, state_id]
      properties:
        context_id: {$ref: "#/components/schemas/StableId"}
        state_id: {$ref: "#/components/schemas/StableId"}
        layout: {$ref: "#/components/schemas/NodeLayoutInput"}
    CreateElementCommand:
      type: object
      required: [command_type, payload]
      properties:
        command_type: {const: CREATE_ELEMENT}
        payload: {$ref: "#/components/schemas/CreateElementPayload"}
    CreateFeatureCommand:
      type: object
      required: [command_type, payload]
      properties:
        command_type: {const: CREATE_FEATURE}
        payload: {$ref: "#/components/schemas/CreateFeaturePayload"}
    CreateFactCommand:
      type: object
      required: [command_type, payload]
      properties:
        command_type: {const: CREATE_FACT}
        payload:
          oneOf:
            - $ref: "#/components/schemas/LegacyConsumptionPayload"
            - $ref: "#/components/schemas/CreateFactPayload"
    CreateStateCommand:
      type: object
      required: [command_type, payload]
      properties:
        command_type: {const: CREATE_STATE}
        payload: {$ref: "#/components/schemas/CreateStatePayload"}
    UpdateStateCommand:
      type: object
      required: [command_type, payload]
      properties:
        command_type: {const: UPDATE_STATE}
        payload: {$ref: "#/components/schemas/UpdateStatePayload"}
    UpdateFactCommand:
      type: object
      required: [command_type, payload]
      properties:
        command_type: {const: UPDATE_FACT}
        payload: {$ref: "#/components/schemas/UpdateFactPayload"}
    DeleteConstructCommand:
      type: object
      required: [command_type, payload]
