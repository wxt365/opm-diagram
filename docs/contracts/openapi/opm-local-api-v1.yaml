      properties:
        context_id: {$ref: "#/components/schemas/StableId"}
        state_id: {$ref: "#/components/schemas/StableId"}
        owner_ref: {$ref: "#/components/schemas/TargetLocator"}
        capability_ref: {$ref: "#/components/schemas/CapabilityReference"}
        name_or_value: {type: string, minLength: 1, maxLength: 4000}
        state_roles: {$ref: "#/components/schemas/StateRoles"}
        occurrence: {$ref: "#/components/schemas/OccurrenceInput"}
        layout: {$ref: "#/components/schemas/NodeLayoutInput"}
        capability_query_id: {$ref: "#/components/schemas/StableId"}
        selected_option_id: {$ref: "#/components/schemas/StableId"}
    CreateFeaturePayload:
      type: object
      additionalProperties: false
      required: [context_id, owner_element_id, feature_kind, capability_ref, name, occurrence, layout, capability_query_id, selected_option_id]
      properties:
        context_id: {$ref: "#/components/schemas/StableId"}
        owner_element_id: {$ref: "#/components/schemas/StableId"}
        feature_kind: {type: string, enum: [ATTRIBUTE, OPERATION]}
        capability_ref: {$ref: "#/components/schemas/CapabilityReference"}
        name: {type: string, minLength: 1, maxLength: 256}
        occurrence: {$ref: "#/components/schemas/OccurrenceInput"}
        layout: {$ref: "#/components/schemas/NodeLayoutInput"}
        capability_query_id: {$ref: "#/components/schemas/StableId"}
        selected_option_id: {$ref: "#/components/schemas/StableId"}
    UpdateStatePayload:
      type: object
