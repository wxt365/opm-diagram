          properties:
            artifact_id: {$ref: "#/components/schemas/StableId"}
            modality: {type: string, enum: [OPL, OPT]}
            sentences:
              type: array
              items:
                type: object
                required: [sentence_id, text, ordinal]
                properties:
                  sentence_id: {$ref: "#/components/schemas/StableId"}
                  text: {type: string}
                  ordinal: {type: integer, minimum: 0}
            traces:
              type: array
              items:
                type: object
                required: [sentence_id, fact_ids, occurrence_ids]
                properties:
                  sentence_id: {$ref: "#/components/schemas/StableId"}
                  fact_ids: {type: array, items: {$ref: "#/components/schemas/StableId"}}
                  occurrence_ids: {type: array, items: {$ref: "#/components/schemas/StableId"}}
    FindingListResult:
      type: object
      additionalProperties: false
      required: [meta, data]
      properties:
        meta: {$ref: "#/components/schemas/QueryMeta"}
        data:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [finding_id, rule_id, severity, category, context_id, entity_id]
            properties:
              finding_id: {$ref: "#/components/schemas/StableId"}
              rule_id: {$ref: "#/components/schemas/StableId"}
              severity: {type: string, enum: [BLOCKING, WARNING, SUGGESTION]}
              category: {type: string, minLength: 1}
              context_id: {$ref: "#/components/schemas/StableId"}
              entity_id: {$ref: "#/components/schemas/StableId"}
