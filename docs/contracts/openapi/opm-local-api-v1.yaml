        slot_id: {type: string, minLength: 1, maxLength: 128}
        text: {type: string, maxLength: 4000}
    ModifierInput:
      type: object
      additionalProperties: false
      required: [modifier_id]
      properties:
        modifier_id: {$ref: "#/components/schemas/StableId"}
        value: {type: [string, number, boolean, "null"]}
    ConditionInput:
      type: object
      additionalProperties: false
      required: [condition_id]
      properties:
        condition_id: {$ref: "#/components/schemas/StableId"}
        value: {type: string, maxLength: 4000}
    LogicalGroupInput:
