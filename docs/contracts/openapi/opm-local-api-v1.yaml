      properties:
        state_id: {$ref: "#/components/schemas/StableId"}
        expected_owner_ref: {$ref: "#/components/schemas/TargetLocator"}
        changes:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            name_or_value: {type: string, minLength: 1, maxLength: 4000}
            state_roles: {$ref: "#/components/schemas/StateRoles"}
            ordinal: {type: integer, minimum: 0}
        capability_query_id: {$ref: "#/components/schemas/StableId"}
        selected_option_id: {$ref: "#/components/schemas/StableId"}
    CreateFactPayload:
      type: object
      additionalProperties: false
      required: [context_id, capability_ref, fact_family, normalized_endpoints, direction, labels, modifiers, logical_groups, occurrence, layout, capability_query_id, selected_option_id]
      properties:
        context_id: {$ref: "#/components/schemas/StableId"}
        fact_id: {$ref: "#/components/schemas/StableId"}
        capability_ref: {$ref: "#/components/schemas/CapabilityReference"}
        fact_family: {type: string, enum: [PROCEDURAL, CONTROL, STRUCTURAL, TRANSFORMATION, ENABLING, PROFILE_FACT]}
        normalized_endpoints: {type: array, minItems: 2, items: {$ref: "#/components/schemas/NormalizedEndpoint"}}
        direction: {type: string, enum: [DIRECTED, BIDIRECTIONAL, UNDIRECTED]}
        labels: {type: array, items: {$ref: "#/components/schemas/LabelInput"}}
        modifiers: {type: array, items: {$ref: "#/components/schemas/ModifierInput"}}
        condition: {$ref: "#/components/schemas/ConditionInput"}
        logical_groups: {type: array, items: {$ref: "#/components/schemas/LogicalGroupInput"}}
        collection_completeness: {type: string, enum: [COMPLETE, INCOMPLETE, NOT_APPLICABLE]}
        occurrence: {$ref: "#/components/schemas/OccurrenceInput"}
        layout: {$ref: "#/components/schemas/FactLayoutInput"}
        capability_query_id: {$ref: "#/components/schemas/StableId"}
        selected_option_id: {$ref: "#/components/schemas/StableId"}
    UpdateFactPayload:
      type: object
