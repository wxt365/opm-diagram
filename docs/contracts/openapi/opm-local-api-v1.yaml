      properties:
        group_id: {$ref: "#/components/schemas/StableId"}
        endpoint_ordinals: {type: array, minItems: 1, items: {type: integer, minimum: 0}}
    CreateElementPayload:
      type: object
      additionalProperties: false
      required: [kind, name, layout]
      properties:
        kind: {type: string, enum: [OBJECT, PROCESS]}
        element_id: {$ref: "#/components/schemas/StableId"}
        name: {type: string, minLength: 1, maxLength: 256}
