<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客户端设置</title><link rel="stylesheet" href="settings.css"><script type="module" src="settings.js"></script></head>
<body><main>
  <header><div class="client-brand"><img src="opm-studio.svg" alt="" width="48" height="48"><div><p class="eyebrow">OPM STUDIO</p><h1>客户端设置</h1></div></div><span id="version" class="badge"></span></header>
  <p id="message" role="status" aria-live="polite"></p>
  <section><div class="section-heading"><h2>智能助手</h2><span id="assistant" class="badge"></span></div><p class="muted">建模可离线使用。启用助手后，当前任务的模型上下文会发送至你配置的模型服务。</p>
    <form id="model-form">
      <div class="columns"><label>服务类型<select name="provider"><option value="deepseek">DeepSeek</option><option value="openai">OpenAI 兼容服务</option></select></label><label>模型 ID<input name="model" required maxlength="100" autocomplete="off"></label></div>
      <label>Base URL<input name="baseURL" type="url" required spellcheck="false" autocomplete="off" aria-describedby="base-url-note"></label><p id="base-url-note" class="muted">支持 HTTPS，或本机、局域网 IP 的 HTTP 地址。OpenAI 格式的网关请选择“OpenAI 兼容服务”，并保留所需的 /v1 路径。</p>
      <label>API Key<input name="key" type="password" maxlength="4096" autocomplete="off" placeholder="输入新 Key；留空保留当前凭证"></label>
      <label class="check"><input name="persist" type="checkbox" checked>使用系统凭证保护，保存到此设备</label><p id="credential-note" class="muted"></p>
      <div class="actions"><button type="submit" class="primary">保存配置</button><button id="test" type="button">测试连接</button><button id="clear" type="button">清除 Key</button></div>
    </form>
  </section>
  <section><h2>本地数据</h2><p id="data-path" class="path"></p><p class="muted">备份包括模型、布局、脑图和助手会话，不含 API Key。恢复前会保存当前数据的回退副本。</p>
    <div class="actions"><button id="backup">备份工作区…</button><button id="restore">从备份恢复…</button><button id="open-data">打开数据目录</button></div>
  </section>
  <section><h2>诊断</h2><p class="muted">诊断文件只包含版本和服务状态，不含模型、对话及凭证。</p><div class="actions"><button id="diagnostics">导出诊断…</button><button id="open-logs">打开日志目录</button></div><p id="runtimes" class="muted"></p></section>
</main></body></html>
